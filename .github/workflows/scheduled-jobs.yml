# Free replacement for a paid always-on worker.
#
# The weekly digest and plan-expiry warning jobs used to run inside the API server process via
# node-cron — fine as long as that process stays alive, but there's no reason to pay for an
# always-on host just to fire two jobs a week. This workflow runs the SAME jobs on GitHub's free
# scheduled runners instead: each job below wakes a runner, executes one job via
# Backend/jobs/runJob.js, and exits.
#
# Public repositories get unlimited free Actions minutes, so this costs nothing.
#
# Two notes on correctness:
#   - Every job still takes the Mongo lease (Backend/utils/jobLease.js), so this is safe to run
#     even if the in-process node-cron schedule is ever re-enabled for local dev — a double-trigger
#     is a no-op rather than a duplicate email.
#   - GitHub's scheduler is best-effort and can be delayed by several minutes under load. Both jobs
#     here are either idempotent or time-windowed, so a late run is harmless. Do not use this for
#     anything that must fire at an exact second.
#
# Each job has its own `schedule` trigger and a hardcoded job name, rather than one shared
# `on.schedule` list matched against a cron string at runtime — that string-matching approach can
# silently drift out of sync (edit the cron here, forget to update the matcher there) and fail
# open by skipping the run instead of erroring. A dedicated job per schedule can't drift.
#
# Cron times are UTC.

name: Scheduled Jobs

on:
  schedule:
    # 08:00 UTC daily — plan-expiry warnings
    - cron: '0 8 * * *'
    # 08:00 UTC Monday — weekly digest
    - cron: '0 8 * * 1'

  # lets you trigger any single job by hand from the Actions tab, which is also how you verify
  # the whole setup works without waiting for a schedule
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        required: true
        type: choice
        options:
          - weekly-digest
          - plan-expiry-warnings

jobs:
  plan-expiry-warnings:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'plan-expiry-warnings' || github.event.schedule == '0 8 * * *'
    runs-on: ubuntu-latest
    # targets the "Production – ai-notes-summarizer" environment sir — that's where
    # MONGO_DB_URL/MAIL_*/FRONTEND_URL/GROQ_API_KEY actually live (added there originally for the
    # Vercel integration). Without this, ${{ secrets.* }}/${{ vars.* }} below all resolve empty,
    # since repo-level and environment-level values are separate scopes.
    environment: Production – ai-notes-summarizer
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - name: Install dependencies
        working-directory: Backend
        run: npm ci --omit=dev
      - name: Run
        working-directory: Backend
        # Only what the jobs actually use. jobs/runJob.js deliberately does not check the full
        # REQUIRED_ENV_VARS list Backend/index.js demands (JWT_PRIVATE_KEY, CSRF_SECRET etc. — a
        # cron job never touches auth), so it only needs MONGO_DB_URL plus whatever the specific
        # job uses.
        #
        # MAIL_RELAY_URL/MAIL_RELAY_SECRET are how this repo's Nodemailer.js actually sends mail in
        # production (Render blocks outbound SMTP, so mail goes via a Vercel relay function) — set
        # these, not MAIL_HOST/MAIL_USER/MAIL_PASS, unless you're intentionally using direct SMTP.
        #
        # MONGO_DB_URL/MAIL_PASS/MAIL_RELAY_SECRET are credentials, so they're Environment secrets
        # (encrypted, redacted in logs); FRONTEND_URL/MAIL_HOST/MAIL_USER/MAIL_RELAY_URL aren't
        # sensitive, so they're plain Environment variables — match each reference below to where
        # it's actually stored, or it silently resolves empty.
        env:
          NODE_ENV: production
          MONGO_DB_URL: ${{ secrets.MONGO_DB_URL }}
          MAIL_RELAY_URL: ${{ vars.MAIL_RELAY_URL }}
          MAIL_RELAY_SECRET: ${{ secrets.MAIL_RELAY_SECRET }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_USER: ${{ vars.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: node jobs/runJob.js plan-expiry-warnings

  weekly-digest:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'weekly-digest' || github.event.schedule == '0 8 * * 1'
    runs-on: ubuntu-latest
    environment: Production – ai-notes-summarizer
    # must stay under jobs/runJob.js's weekly-digest leaseMs (15 min) sir — otherwise a run that
    # hits this ceiling gets SIGKILLed before the lease's finally-block release runs, holding the
    # lease for minutes longer than the job that actually needed it
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - name: Install dependencies
        working-directory: Backend
        run: npm ci --omit=dev
      - name: Run
        working-directory: Backend
        # GROQ_API_KEY is used by the weekly digest's AI recap paragraph — if missing, the digest
        # still sends without the recap (see utils/DigestJob.js), so it's not strictly required,
        # but set it for the full experience.
        env:
          NODE_ENV: production
          MONGO_DB_URL: ${{ secrets.MONGO_DB_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAIL_RELAY_URL: ${{ vars.MAIL_RELAY_URL }}
          MAIL_RELAY_SECRET: ${{ secrets.MAIL_RELAY_SECRET }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_USER: ${{ vars.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: node jobs/runJob.js weekly-digest
